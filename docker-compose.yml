version: '3.8'

services:
  db:
    image: postgres:15
    container_name: pipeline_pioneers_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pipeline_pioneers
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts
    container_name: pipeline_pioneers_jenkins
    user: root # Run as root to allow docker in docker (simplified for local dev)
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Optional: allow Jenkins to run Docker commands
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: pipeline_pioneers_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: pipeline_pioneers_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

volumes:
  pgdata:
  jenkins_home:
